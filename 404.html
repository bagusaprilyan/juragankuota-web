<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>JuraganKuota</title>
    <script>
      /* SPA fallback untuk GitHub Pages (BrowserRouter).
         Simpan path di sessionStorage lalu arahkan ke root — React Router
         akan memulihkannya. Ini mencegah 404 keras saat refresh /order/:kode. */
      (function () {
        var p = location.pathname + location.search + location.hash
        try { sessionStorage.setItem('spa_redirect', p) } catch (e) {}
        location.replace('/')
      })()
    </script>
  </head>
  <body></body>
</html>
